name: DCOIR Review
commands:
  - /dcoir-review
  - /or-review
  - /openrouter-review
model: anthropic/claude-opus-5
model_stack:
  - anthropic/claude-opus-5
  - openai/gpt-5.6-sol-pro
fallback_models: []
max_inline_comments: 12
max_files: 100
max_patch_chars: 160000
min_confidence: 0.92
openrouter_max_attempts: 3
openrouter_retry_max_seconds: 8
first_pass_deep_review: true
per_file_first_pass_review: true
per_file_review_concurrency: 4
per_file_review_max_files: 100
per_file_review_max_file_chars: 40000
deep_review_max_files: 20
deep_review_max_file_chars: 40000
deep_review_max_total_chars: 200000
fix_synthesis_enabled: true
fix_synthesis_max_findings: 8
adversarial_confirmation_review: true
adversarial_confirmation_model: openai/gpt-5.6-sol-pro
semantic_adjudication_review: true
semantic_adjudication_model: anthropic/claude-opus-5
semantic_adjudication_max_findings: 8
provider_order: []
provider_allow_fallbacks: true
provider_require_parameters: true
ignored_providers: []
openrouter_route: ''
openrouter_service_tier: ''
auto_allowed_models: []
auto_cost_quality_tradeoff: null
session_id_prefix: dcoir-review
progress_comment_enabled: true
progress_comment_max_chars: 60000
debug: false
debug_artifact_dir: /tmp/dcoir_review_debug
debug_max_prompt_chars: 1200000
debug_max_response_chars: 240000
quality_retry_enabled: true
quality_retry_max_findings: 12
quality_retry_min_summary_chars: 40
quality_retry_max_prompt_chars: 1200000
quality_retry_max_response_chars: 240000
verification_enabled: true
verification_max_candidates: 12
verification_model: anthropic/claude-opus-5
verification_min_confidence: 0.95
verification_max_prompt_chars: 240000
verification_max_response_chars: 80000
repair_author_model: anthropic/claude-opus-5
repair_critic_model: openai/gpt-5.6-sol-pro
repair_critic_min_confidence: 0.95
repair_max_edit_ranges: 6
repair_max_prompt_chars: 260000
repair_max_response_chars: 100000
static_validation_context_paths:
  - .github/dcoir_review/evaluation/semantic_recall_corpus_v1.json
  - .github/dcoir_review/evaluation/precision_corpus_v1.json
review_assist_context_paths:
  - AGENTS.md
risk_sentinels: []
validation_commands:
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_strict_runtime_patch_selftest.py
