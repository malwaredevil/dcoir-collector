# Governed DCOIR Review configuration for DCOIR-Collector/dcoir-collector.
# This production config is used by .github/workflows/openrouter-pr-review.yml
# through .github/dcoir_review/scripts/openrouter_pr_review_pareto_context.py.

commands:
  - /or-review
  - /openrouter-review
  - /dcoir-review

# Issue #456: use a fixed frontier review model instead of a cost-optimized
# router for the primary detector.  The prior Pareto route could legitimately
# serve a cheaper model that cleared a coding-score threshold, which is not the
# same contract as adversarial semantic review quality.
model: anthropic/claude-opus-5
model_stack:
  - anthropic/claude-opus-5
  - openai/gpt-5.6-sol-pro
smoke_test_free_model: false

# Retained for compatibility with the Pareto payload layer; it is inactive while
# the governed primary model is fixed rather than openrouter/pareto-code.
pareto_min_coding_score: 0.80

# Auto Router remains configured only for compatibility/smoke surfaces and is
# not in the governed production model_stack.
auto_cost_quality_tradeoff: 2
auto_allowed_models:
  - anthropic/claude-sonnet*
  - openai/gpt-5*
  - google/gemini-2.5-pro*
  - google/gemini-3.1-pro-preview*
  - qwen/qwen3-coder*
  - deepseek/deepseek-v3*

# Keep native OpenRouter fallback, route, and service-tier controls unset here.
# The governed model_stack above owns the explicit model fallback order.
fallback_models:

openrouter_route:
openrouter_service_tier:
openrouter_session_id_prefix: dcoir-review

# Frontier models used by the governed review path support substantially larger
# context than the old 60k reviewer budget.  Preserve enough room for a full PR
# aggregate challenger while keeping per-file prompts independently bounded.
max_prompt_chars: 120000
max_files: 100
max_inline_comments: 12

# Deep review must not silently equate "top eight files" with "the PR".  The
# per-file detector covers every fetched changed file up to the governed 100-file
# ceiling; the aggregate context remains separately bounded for synthesis.
first_pass_deep_review: true
deep_review_max_files: 20
deep_review_max_file_chars: 20000
deep_review_max_total_chars: 60000
per_file_first_pass_review: true
per_file_review_concurrency: 6
per_file_review_max_files: 100
per_file_review_max_file_chars: 40000

# v32 requires an independent model-family challenger before a deep result is
# finalized.  This pass is intentionally not a fallback for model failure; it is
# a second semantic review whose findings are unioned with the primary pass.
adversarial_confirmation_review: true
adversarial_confirmation_model_stack:
  - openai/gpt-5.6-sol-pro
review_reasoning_effort: xhigh

fix_synthesis_enabled: true
# v33 keeps this as the one-click repair author/critic budget. It is deliberately
# smaller than max_inline_comments: verifier-supported findings above this budget
# may still publish, but without an automatically synthesized Commit suggestion.
fix_synthesis_max_findings: 8
fix_synthesis_min_confidence: 0.80
required_finding_reserved_budget: 9
required_finding_min_per_family: 2

request_changes_on_findings: false
minimum_confidence: 0.70
fail_on_unanchored_findings: true
fail_on_summary_only_problem: true
review_quality_retry_on_rejected_output: true

risk_sentinel_quality_gate: true
risk_sentinel_retry_on_empty: true
risk_sentinel_max_anchors: 12

post_summary_when_findings: false
include_confidence: false
redact_secret_literals: true
# Temporary acceptance-cycle diagnostics for #456. Disable again after blind
# recall acceptance is proven and the debug artifacts have been read back.
debug: true

openrouter_max_attempts: 4
openrouter_retry_max_seconds: 45
script_timeout_seconds: 1500
post_progress_comment: false

ignored_providers:

validation_commands:
  - python3 .github/dcoir_review/scripts/openrouter_pr_review_pareto_context_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v16_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v19_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v20_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v21_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v22_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v23_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v24_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v25_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v26_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v27_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v28_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v29_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v30_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v31_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v32_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_required_runtime_patch_v33_selftest.py
  - python3 .github/dcoir_review/scripts/dcoir_review_precision_regression_selftest.py
  - python3 .github/dcoir_review/scripts/openrouter_pr_review_hardened_selftest.py
  - python3 .github/dcoir_review/scripts/openrouter_pr_review_quality_recovery_selftest.py
  - python3 .github/dcoir_review/scripts/openrouter_pr_review_summary_problem_selftest.py
  # Requires a real git checkout for full changed-file discovery; extracted
  # workspaces may only exercise this as a smoke check.
  - bash .github/dcoir_review/scripts/validate-codex-local.sh
  - pwsh -NoProfile -File .github/dcoir_review/scripts/validate-windows-powershell-51.ps1 -AllowPowerShell7 -AllowEmpty
  - python3 .github/dcoir_review/scripts/validate-codeql-security-workflow.py

guidance_files:
  - AGENTS.md
  - README.md

allowed_authors:
  - malwaredevil

ignored_authors:
  - github-actions[bot]
  - dependabot[bot]
  - chatgpt-codex-connector[bot]
