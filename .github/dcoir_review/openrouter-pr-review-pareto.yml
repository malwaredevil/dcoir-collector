# Governed DCOIR Review configuration for DCOIR-Collector/dcoir-collector.
# This production config is used by .github/workflows/openrouter-pr-review.yml
# through .github/dcoir_review/scripts/openrouter_pr_review_pareto_context.py.

commands:
  - /or-review
  - /openrouter-review
  - /dcoir-review

# Issue #456: use a fixed frontier review model instead of a cost-optimized
# router for the primary detector.  The prior Pareto route could legitimately
# serve a cheaper model that cleared a coding-score threshold, which is not the
# same contract as adversarial semantic review quality.
model: anthropic/claude-opus-5
model_stack:
  - anthropic/claude-opus-5
  - openai/gpt-5.6-sol-pro
smoke_test_free_model: false

# Retained for compatibility with the Pareto payload layer; it is inactive while
# the governed primary model is fixed rather than openrouter/pareto-code.
pareto_min_coding_score: 0.80

# Auto Router remains configured only for compatibility/smoke surfaces and is
# not in the governed production model_stack.
auto_cost_quality_tradeoff: 2
auto_allowed_models:
  - anthropic/claude-sonnet*
  - openai/gpt-5*
  - google/gemini-2.5-pro*
  - google/gemini-3.1-pro-preview*
  - qwen/qwen3-coder*
  - deepseek/deepseek-v3*

# Keep native OpenRouter fallback, route, and service-tier controls unset here.
# The governed model_stack above owns the explicit model fallback order.
fallback_models:

openrouter_route:
openrouter_service_tier:
openrouter_session_id_prefix: dcoir-review

# Frontier models used by the governed review path support substantially larger
# context than the old 60k reviewer budget.  Preserve enough room for a full PR
# aggregate challenger while keeping per-file prompts independently bounded.
max_prompt_chars: 120000
max_files: 100
max_inline_comments: 12

# Deep review must not silently equate "top eight files" with "the PR".  The
# per-file detector covers every fetched changed file up to the governed 100-file
# ceiling; the aggregate context remains separately bounded for synthesis.
first_pass_deep_review: true
deep_review_max_files: 20
deep_review_max_file_chars: 20000
deep_review_max_total_chars: 60000
per_file_first_pass_review: true
# v40 lowers the normal fan-out from six after live blind evidence showed that
# six simultaneous frontier calls can exceed OpenRouter's current in-flight
# credit window. If that transient 402 still occurs, the reviewer drains the
# parallel wave, retries only the affected files at concurrency <=2, then gives
# any still-saturated file one final serial attempt before failing coverage closed.
per_file_review_concurrency: 4
per_file_review_max_files: 100
per_file_review_max_file_chars: 40000

# v47 projects the #485 calibrated request contract only onto routine per-file
# first-pass calls. The shared global model stack/reasoning above remains the
# premium contract for challenger, adjudication, verification, escalation, and
# any whole-PR quality-retry path. Response Healing and fail-closed finish-reason
# enforcement are supplied by the v47 stage projection when these keys are set.
per_file_review_model_stack:
  - anthropic/claude-sonnet-5
per_file_review_reasoning_effort: high
per_file_review_max_tokens: 32768
per_file_review_provider_sort: price

# v32 requires an independent model-family challenger before a deep result is
# finalized.  This pass is intentionally not a fallback for model failure; it is
# a second semantic review whose findings are unioned with the primary pass.
adversarial_confirmation_review: true
adversarial_confirmation_model_stack:
  - openai/gpt-5.6-sol-pro
review_reasoning_effort: xhigh

# v35 turns the broad detector/challenger union into a small set of demonstrated
# root causes before the expensive per-finding verifier. The adjudicator is an
# authoritative review stage, not another union: it may suppress unsupported or
# duplicate hypotheses and may independently recover a demonstrable detector miss.
semantic_adjudication_review: true
semantic_adjudication_model_stack:
  - anthropic/claude-opus-5
  - openai/gpt-5.6-sol-pro
semantic_adjudication_max_findings: 8
semantic_adjudication_candidate_digest_chars: 24000

# v44 keeps the full primary detector coverage, then invokes the expensive
# challenger/adjudicator only for uncertain or high-risk candidate regions when
# their exact-head evidence can be bounded safely. Any ambiguous dependency,
# insufficient context, or out-of-scope challenger result widens fail-closed.
candidate_scoped_escalation_review: true
candidate_escalation_confidence_margin: 0.10
candidate_escalation_max_paths: 4
candidate_escalation_file_chars: 12000
candidate_escalation_total_context_chars: 48000

# v45 makes final GitHub review prose derive from the exact-head verifier
# disposition. Detector/challenger/adjudicator summary prose and unanchored
# hypotheses cannot bypass the publication verifier.
verifier_authoritative_publication_review: true

# v46 builds one exact-head semantic context package for all downstream review
# projections. Only trusted, low-risk, small incremental scopes receive the
# reduced prompt/context budget; initial, deep, risky, stale, cumulative, and
# fallback scopes retain the full existing quality floor.
canonical_semantic_context_review: true
adaptive_semantic_budgets_review: true
adaptive_semantic_min_prompt_chars: 48000
adaptive_semantic_small_delta_prompt_chars: 60000
adaptive_semantic_small_delta_max_files: 4
adaptive_semantic_small_delta_max_diff_chars: 20000
adaptive_semantic_small_delta_max_context_chars: 30000

fix_synthesis_enabled: true
# v33 keeps this as the bounded repair-author/critic budget, separately from the
# larger verifier/publication ceiling. v36 may turn one verified finding inside
# this budget into a coordinated repair set with multiple ranged GitHub
# suggestions; findings outside the repair budget still publish without repair
# synthesis.
fix_synthesis_max_findings: 8
fix_synthesis_min_confidence: 0.80
required_finding_reserved_budget: 9
required_finding_min_per_family: 2

request_changes_on_findings: false
minimum_confidence: 0.70
fail_on_unanchored_findings: true
fail_on_summary_only_problem: true
review_quality_retry_on_rejected_output: true

risk_sentinel_quality_gate: true
risk_sentinel_retry_on_empty: true
risk_sentinel_max_anchors: 12

post_summary_when_findings: false
include_confidence: false
redact_secret_literals: true
debug: false

openrouter_max_attempts: 4
openrouter_retry_max_seconds: 45
# v40 recovery may legitimately add a second, lower-concurrency detector wave.
# Keep the internal timeout bounded below the reusable workflow's 45-minute job
# ceiling so terminal-failure reporting and artifact upload still have headroom.
script_timeout_seconds: 2400
post_progress_comment: false

ignored_providers:

validation_commands:
