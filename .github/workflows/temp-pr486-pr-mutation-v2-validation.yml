name: 98 Temp - PR486 PR mutation v2 validation
run-name: PR486 PR mutation v2 validation | target c26016e79957fb543bcfdef6afd63c8e6ea48ac1

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/workflows/temp-pr486-pr-mutation-v2-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c26016e79957fb543bcfdef6afd63c8e6ea48ac1
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile mutation evaluator
        run: |
          python3 -m py_compile .github/dcoir_review/scripts/dcoir_review_pr_mutation_eval.py
          python3 -m py_compile .github/dcoir_review/scripts/dcoir_review_pr_mutation_eval_selftest.py
      - name: Run corrected mutation selftest
        run: python3 .github/dcoir_review/scripts/dcoir_review_pr_mutation_eval_selftest.py
      - name: Prove corrected 12-PR zero-network plan
        env:
          OPENROUTER_API_KEY: ''
        run: |
          python3 .github/dcoir_review/scripts/dcoir_review_pr_mutation_eval.py --candidate sonnet5-high --max-tokens 32768 --output /tmp/pr-mutation-plan-v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pr-mutation-plan-v2.json'))
          assert d['schema_version']=='dcoir_review_pr_mutation_eval_report_v2'
          assert d['mode']=='plan'
          assert d['planned_requests']==12
          assert d['network_requests_made']==0
          assert len(d['selected_case_ids'])==12
          print('PASS: corrected 12-PR mutation plan; zero network calls')
          PY
      - name: Keep prior evaluation lanes green
        run: |
          python3 .github/dcoir_review/scripts/dcoir_review_first_pass_candidate_eval_selftest.py
          python3 .github/dcoir_review/scripts/dcoir_review_first_pass_budget_eval_selftest.py
          python3 .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_eval_selftest.py
          python3 .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_fixture_validity_v2.py
