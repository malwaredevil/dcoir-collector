name: 98 Temp - PR486 prompt isolation validation
run-name: PR486 prompt isolation validation | ${{ github.sha }}

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/workflows/temp-pr486-prompt-isolation-validation.yml'

permissions:
  contents: read

jobs:
  prompt-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove prompt isolation and zero-network benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            echo 'OPENROUTER_API_KEY must not be available.' >&2
            exit 2
          fi
          python -m py_compile \
            .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_eval.py \
            .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_eval_selftest.py \
            .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_fixture_validity_v2.py \
            .github/dcoir_review/scripts/dcoir_review_first_pass_candidate_eval.py \
            .github/dcoir_review/scripts/dcoir_review_first_pass_candidate_eval_selftest.py \
            .github/dcoir_review/scripts/dcoir_review_first_pass_budget_eval.py \
            .github/dcoir_review/scripts/dcoir_review_first_pass_budget_eval_selftest.py
          cd .github/dcoir_review/scripts
          python dcoir_review_multilang_adversarial_eval_selftest.py
          python dcoir_review_multilang_adversarial_fixture_validity_v2.py
          python dcoir_review_first_pass_candidate_eval_selftest.py
          python dcoir_review_first_pass_budget_eval_selftest.py
          python dcoir_review_multilang_adversarial_eval.py --candidate sonnet5-high > /tmp/pr486-plan.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/pr486-plan.json', encoding='utf-8'))
          assert report['mode'] == 'plan'
          assert report['planned_requests'] == 40
          assert report['network_requests_made'] == 0
          assert len(report['selected_case_ids']) == 40
          print(json.dumps({'status':'pass','planned_requests':40,'network_requests_made':0}, sort_keys=True))
          PY
