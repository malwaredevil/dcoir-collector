name: 98 Temp - PR486 adversarial witness validation
run-name: PR486 adversarial behavioral witness validation | ${{ github.sha }}

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/dcoir_review/scripts/dcoir_review_multilang_adversarial_fixture_validity.py'
      - '.github/workflows/temp-pr486-adversarial-witness-validation.yml'

permissions:
  contents: read

jobs:
  witness-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify no inference credentials and run behavioral witness validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            echo 'OPENROUTER_API_KEY must not be available.' >&2
            exit 2
          fi
          python -m py_compile .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_fixture_validity.py
          python .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_fixture_validity.py
