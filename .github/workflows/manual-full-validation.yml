# DCOIR WORKFLOW OPERATOR NOTES
# Workflow key:
# - workflow-validation-manual-full-validation-0013
# Purpose:
# - Orchestrate the broad manual regression suite across collector, Gemini Agent, shared agent-runtime, and both OpenAI GPT package targets by reusing their canonical validation workflows.
# Use when:
# - Use for manual regression beyond validate-on-push, especially before readiness claims or after structural, package, or cross-provider agent changes.
# Do not use when:
# - Do not use as a quick push gate when validate-on-push is sufficient.
# Trigger model:
# - schedule: 30 6 * * 0; workflow_dispatch inputs: suite
# Required inputs:
# - suite: Collector harness validation suite to run default=FullRegression
# Required secrets/config:
# - Use secret/config names only as defined in the called reusable workflows and Local Configuration Registry; never place secret values in workflow comments, requests, reports, logs, or bundles.
# Runtime dependencies:
# - Reuses reusable-collector-validation.yml, reusable-openai-gpt-deployment-package-build.yml, reusable-gemini-bundle-build.yml, reusable-validate-gemini-behavioral-replay.yml, and reusable-validate-gemini-production-like-harness.yml so this lane inherits the governed package and behavioral validation contracts instead of duplicating them.
# Expected outputs/readback:
# - Collector FullRegression/Pester/runtime-package/mission-readiness evidence; OpenAI shared-agent-runtime, two-GPT package, combined deployment-release, and static parity evidence; Gemini validated bundle build, deterministic replay, and production-like harness evidence; per-lane report artifacts; and an aggregate manual-full-validation result artifact.
# Safety notes:
# - The selected collector suite bounds collector readiness claims. Broad manual validation requires every called validation lane to pass. OpenAI package/parity evidence does not prove live WebUI deployment, and Gemini bundle/replay/production-like evidence does not by itself prove live-model behavior.
# Maintenance notes:
# - Keep this orchestration aligned with the canonical reusable validators instead of copying their command bodies here.
# - Keep this header aligned with executable behavior whenever triggers, inputs, reusable validators, reports, artifacts, permissions, or safety checks change.
# - Keep this header aligned with current repo-root GitHub guidance and the active `ircore` operating model when authority or routing language changes.
# Authority routing:
# - GitHub is canonical for workflow/source truth and this header owns workflow-specific execution guidance.
# - Supabase `ircore` owns operational routing, validation rules, reusable lessons, and active state.
# - Treat Airtable references as historical evidence only; active workflow routing must not depend on Airtable.
name: 00 Operator - Full Validation
run-name: Full Validation (${{ github.event.inputs.suite || 'FullRegression' }}) | #${{ github.run_number }}

on:
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: Collector harness validation suite to run
        required: true
        default: FullRegression
        type: choice
        options:
          - Core
          - Retrieval
          - QuickAliases
          - SessionBehavior
          - TargetedCollection
          - ChunkingOversizeArtifact
          - ChunkingReconstructionMetadata
          - Tier2BoundedCollect
          - MajorVersion
          - FailureGates
          - FullRegression

permissions:
  contents: read

concurrency:
  group: manual-full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collector_validation:
    uses: ./.github/workflows/reusable-collector-validation.yml
    permissions:
      contents: read
    with:
      workflow_name: manual-full-validation
      surface_profile: manual_full_validation
      validation_prefix: manual_full
      artifact_name: manual-full-validation-${{ inputs.suite || 'FullRegression' }}
      artifact_paths: |
        project_sources/TestResults/**
        project_sources/validation/out_manual_full_collector/**
        project_sources/validation/out_manual_full_validate_dcoir_run_fixtures/**
        project_sources/validation/out_preflight_documentation_quality/**
        project_sources/validation/out_manual_full_documentation_quality/**
        project_sources/collector/powershell_review_assist_manual_full_workflow_report.json
        project_sources/collector/powershell_review_assist_manual_full_workflow_report.md
      artifact_retention_days: 21
      report_title: Manual full collector validation summary
      report_scope: selected deep collector validation suite
      report_note: collector-only evidence including TestResults, pinned DCOIR Pester output, collector runtime package validation output, collector runtime/harness output, validate_DCOIR_Run fixture output, documentation-quality output, PowerShell review-assist JSON/Markdown, and mission-readiness gate output when produced. The parent workflow also runs separate canonical OpenAI and Gemini validation jobs.
      report_claim: This report section covers the collector lane only. The parent workflow conclusion aggregates collector, OpenAI GPT package, Gemini bundle, Gemini deterministic replay, and Gemini production-like harness validation. Use FullRegression plus the mission-readiness gate for broad collector readiness.
      run_gemini_smoke_build: false
      run_windows_powershell_5_1_syntax: true
      run_dcoir_pester: true
      dcoir_pester_version: '5.7.1'
      dcoir_pester_result_path: project_sources/TestResults/pester-manual-full-validation.xml
      dcoir_pester_minimum_test_count: '45'
      run_collector_runtime_package_validation: true
      collector_runtime_package_validation_output_dir: project_sources/validation/out_manual_full_collector/runtime_package_validation
      build_runtime_for_harness: true
      run_harness_suite: true
      harness_suite: ${{ inputs.suite || 'FullRegression' }}
      harness_output_root: project_sources\validation\out_manual_full_collector\harness_results
      enforce_fullregression_mission_readiness: true
      mission_readiness_json_output: project_sources/validation/out_manual_full_collector/collector_mission_readiness_gate_report.json
      mission_readiness_markdown_output: project_sources/validation/out_manual_full_collector/collector_mission_readiness_gate_report.md

  openai_gpt_package_validation:
    uses: ./.github/workflows/reusable-openai-gpt-deployment-package-build.yml
    permissions:
      contents: read
    with:
      report_artifact_name: chatgpt-workflow-report-section-manual-full-openai

  gemini_bundle_validation:
    uses: ./.github/workflows/reusable-gemini-bundle-build.yml
    permissions:
      contents: read
    with:
      skip_validation: false
      report_artifact_name: chatgpt-workflow-report-section-manual-full-gemini-bundle

  gemini_behavioral_replay_validation:
    uses: ./.github/workflows/reusable-validate-gemini-behavioral-replay.yml
    permissions:
      contents: read
    with:
      caller_event_name: ${{ github.event_name }}
      report_artifact_name: chatgpt-workflow-report-section-manual-full-gemini-replay

  gemini_production_like_harness_validation:
    uses: ./.github/workflows/reusable-validate-gemini-production-like-harness.yml
    permissions:
      contents: read
    with:
      caller_event_name: ${{ github.event_name }}
      harness_mode: full
      require_stored_artifacts: false
      report_artifact_name: chatgpt-workflow-report-section-manual-full-gemini-production-like

  aggregate_validation:
    if: ${{ always() }}
    needs:
      - collector_validation
      - openai_gpt_package_validation
      - gemini_bundle_validation
      - gemini_behavioral_replay_validation
      - gemini_production_like_harness_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Write aggregate validation report
        shell: bash
        env:
          SELECTED_SUITE: ${{ inputs.suite || 'FullRegression' }}
          COLLECTOR_RESULT: ${{ needs.collector_validation.result }}
          OPENAI_RESULT: ${{ needs.openai_gpt_package_validation.result }}
          GEMINI_BUNDLE_RESULT: ${{ needs.gemini_bundle_validation.result }}
          GEMINI_REPLAY_RESULT: ${{ needs.gemini_behavioral_replay_validation.result }}
          GEMINI_PRODUCTION_LIKE_RESULT: ${{ needs.gemini_production_like_harness_validation.result }}
        run: |
          set -euo pipefail
          mkdir -p manual_full_validation_aggregate
          cat > manual_full_validation_aggregate/manual_full_validation_aggregate.md <<REPORT
          ## Manual full validation aggregate

          - workflow: manual-full-validation
          - workflow_run_id: ${GITHUB_RUN_ID}
          - workflow_run_attempt: ${GITHUB_RUN_ATTEMPT}
          - head_sha: ${GITHUB_SHA}
          - ref: ${GITHUB_REF}
          - event_name: ${GITHUB_EVENT_NAME}
          - selected_collector_suite: ${SELECTED_SUITE}
          - collector_validation: ${COLLECTOR_RESULT}
          - openai_gpt_package_validation: ${OPENAI_RESULT}
          - gemini_bundle_validation: ${GEMINI_BUNDLE_RESULT}
          - gemini_behavioral_replay_validation: ${GEMINI_REPLAY_RESULT}
          - gemini_production_like_harness_validation: ${GEMINI_PRODUCTION_LIKE_RESULT}

          Broad manual-validation success requires all five validation lanes to succeed. OpenAI evidence is static package/parity evidence only; Gemini repository-side evidence does not by itself prove live-model behavior.
          REPORT

      - name: Upload aggregate validation report
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: manual-full-validation-aggregate-report
          path: manual_full_validation_aggregate/manual_full_validation_aggregate.md
          if-no-files-found: error
          retention-days: 21

      - name: Enforce aggregate validation result
        shell: bash
        env:
          COLLECTOR_RESULT: ${{ needs.collector_validation.result }}
          OPENAI_RESULT: ${{ needs.openai_gpt_package_validation.result }}
          GEMINI_BUNDLE_RESULT: ${{ needs.gemini_bundle_validation.result }}
          GEMINI_REPLAY_RESULT: ${{ needs.gemini_behavioral_replay_validation.result }}
          GEMINI_PRODUCTION_LIKE_RESULT: ${{ needs.gemini_production_like_harness_validation.result }}
        run: |
          set -euo pipefail
          for result in \
            "$COLLECTOR_RESULT" \
            "$OPENAI_RESULT" \
            "$GEMINI_BUNDLE_RESULT" \
            "$GEMINI_REPLAY_RESULT" \
            "$GEMINI_PRODUCTION_LIKE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Manual full validation lane result was not success: $result" >&2
              exit 1
            fi
          done
