name: Temporary PR486 v7 Sonnet title paid eval

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run:
    if: github.event.head_commit.message == 'Temporary PR486 v7 Sonnet title paid eval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run approved one-request batch
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DCOIR_EVAL_REQUEST_CHECKPOINT="$RUNNER_TEMP/pr486-v7-sonnet-title-calls.jsonl" \
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval.py \
            --candidate sonnet5-high \
            --max-tokens 32768 \
            --timeout-seconds 300 \
            --execute-live \
            --case precision-gha-title-via-env-no-shell-expressions-tested \
            --output "$RUNNER_TEMP/pr486-v7-sonnet-title-report.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr486-v7-sonnet-title-evidence
          path: |
            ${{ runner.temp }}/pr486-v7-sonnet-title-report.json
            ${{ runner.temp }}/pr486-v7-sonnet-title-calls.jsonl
          if-no-files-found: error
