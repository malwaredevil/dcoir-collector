name: 98 Temp - PR486 adversarial full40 Sonnet
run-name: PR486 adversarial full40 Sonnet | target e5100f24713ef24e15316d295e708b6c83f3d992

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/workflows/temp-pr486-adversarial-full40-sonnet.yml'

permissions:
  contents: read

jobs:
  paid-full40:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact approved evaluation head
        uses: actions/checkout@v7
        with:
          ref: e5100f24713ef24e15316d295e708b6c83f3d992
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare artifact directory
        shell: pwsh
        env:
          DCOIR_DOWNLOADS_DIR: /tmp/dcoir-downloads
        run: New-Item -ItemType Directory -Force -Path $env:DCOIR_DOWNLOADS_DIR | Out-Null
      - name: Run approved 40-request Sonnet adversarial evaluation
        shell: pwsh
        env:
          DCOIR_DOWNLOADS_DIR: /tmp/dcoir-downloads
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          python3 .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_eval.py --candidate sonnet5-high --max-tokens 32768 --execute-live --timeout-seconds 300 --output "$env:DCOIR_DOWNLOADS_DIR/issue485-pr486-adversarial-full40-sonnet-cap32768.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr486-adversarial-full40-sonnet-cap32768
          path: /tmp/dcoir-downloads/*.json
          if-no-files-found: error
          retention-days: 14
