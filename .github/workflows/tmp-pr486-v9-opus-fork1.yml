name: Temporary PR486 v9 Opus fork1 control eval

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run:
    if: github.event.head_commit.message == 'Temporary PR486 v9 Opus fork1 control eval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: f13abaca86f05c434e6a48035c3defa8be78a0cd
          persist-credentials: false

      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "f13abaca86f05c434e6a48035c3defa8be78a0cd"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Deterministic v9 gate with no inference credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          unset OPENROUTER_API_KEY DCOIR_OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY OPENAI_API_KEY DCOIR_OPENAI_API_KEY DCOIR_GEMINI_API
          python -m py_compile \
            .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v9.py \
            .github/dcoir_review/scripts/dcoir_review_pr_precision_fixture_v9_selftest.py
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_fixture_v9_selftest.py
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v9.py \
            --candidate opus5-xhigh-control \
            --max-tokens 65536 \
            --case precision-gha-fork-semantic-secret-context-approved-tested \
            --output "$RUNNER_TEMP/pr486-v9-opus-fork1-plan.json"
          python - <<'PY'
          import json
          import os
          expected = ['precision-gha-fork-semantic-secret-context-approved-tested']
          path = os.path.join(os.environ['RUNNER_TEMP'], 'pr486-v9-opus-fork1-plan.json')
          with open(path, encoding='utf-8') as handle:
              report = json.load(handle)
          assert report.get('mode') == 'plan', report.get('mode')
          assert int(report.get('network_requests_made', -1)) == 0, report.get('network_requests_made')
          assert int(report.get('planned_requests', -1)) == 1, report.get('planned_requests')
          assert report.get('selected_candidate_ids') == ['opus5-xhigh-control'], report.get('selected_candidate_ids')
          assert report.get('selected_case_ids') == expected, report.get('selected_case_ids')
          print('v9 deterministic Opus control plan verified: mode=plan, network_requests_made=0, planned_requests=1')
          PY

      - name: Run approved one-request Opus xhigh control
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DCOIR_EVAL_REQUEST_CHECKPOINT="$RUNNER_TEMP/pr486-v9-opus-fork1-calls.jsonl" \
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v9.py \
            --candidate opus5-xhigh-control \
            --max-tokens 65536 \
            --timeout-seconds 300 \
            --execute-live \
            --case precision-gha-fork-semantic-secret-context-approved-tested \
            --output "$RUNNER_TEMP/pr486-v9-opus-fork1-report.json"

      - name: Verify exact request count
        run: test "$(wc -l < "$RUNNER_TEMP/pr486-v9-opus-fork1-calls.jsonl")" -eq 1

      - name: Upload bounded control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr486-v9-opus-fork1-evidence
          path: |
            ${{ runner.temp }}/pr486-v9-opus-fork1-plan.json
            ${{ runner.temp }}/pr486-v9-opus-fork1-report.json
            ${{ runner.temp }}/pr486-v9-opus-fork1-calls.jsonl
          if-no-files-found: error
