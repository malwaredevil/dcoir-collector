name: 98 Temp - PR486 precision context ablation validation
run-name: PR486 precision context ablation no-network validation

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/workflows/temp-pr486-precision-context-ablation-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile and selftest precision lane
        run: |
          python3 -m py_compile .github/dcoir_review/scripts/dcoir_review_pr_precision_eval.py .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_selftest.py
          python3 .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_selftest.py
      - name: Verify no-receipt workflow case is still zero-network in plan mode
        env:
          DCOIR_PRECISION_INCLUDE_TRUSTED_CONTEXT: '0'
        run: |
          env -u OPENROUTER_API_KEY python3 .github/dcoir_review/scripts/dcoir_review_pr_precision_eval.py --candidate sonnet5-high --case precision-gha-title-via-env-approved-tested --output /tmp/ablation-plan.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/ablation-plan.json'))
          assert data['mode'] == 'plan'
          assert data['planned_requests'] == 1
          assert data['network_requests_made'] == 0
          print('context ablation plan PASS: one case, zero network')
          PY
