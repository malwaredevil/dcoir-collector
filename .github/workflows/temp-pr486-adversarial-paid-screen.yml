name: 98 Temp - PR486 adversarial paid screen
run-name: PR486 adversarial paid screen | target 1d5888cf09934b2ca0a120e0d04a8de1497ffab1

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/workflows/temp-pr486-adversarial-paid-screen.yml'

permissions:
  contents: read

jobs:
  paid-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact approved evaluation head
        uses: actions/checkout@v7
        with:
          ref: 1d5888cf09934b2ca0a120e0d04a8de1497ffab1
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare artifact directory
        shell: pwsh
        env:
          DCOIR_DOWNLOADS_DIR: /tmp/dcoir-downloads
        run: New-Item -ItemType Directory -Force -Path $env:DCOIR_DOWNLOADS_DIR | Out-Null
      - name: Run approved 28-request screen
        shell: pwsh
        env:
          DCOIR_DOWNLOADS_DIR: /tmp/dcoir-downloads
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          python3 .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_eval.py --candidate opus5-xhigh-control --case ps-last-exitcode-overwritten-by-second-native-command --case ps-remoting-missing-using-scope --case ps-vectorized-comparison-any-vs-all --case ps-clean-native-exit-snapshot --case py-reuse-key-omits-policy-version --case py-head-checked-only-before-long-review --case py-clean-refetch-head-before-publication --case gha-pull-request-target-runs-untrusted-head --case gha-privileged-workflow-executes-untrusted-artifact --case gha-clean-untrusted-title-via-env --case md-approval-contract-contradicts-automatic-posting --case md-clean-approval-before-review-sequence --case json-duplicate-security-key-last-wins --case json-clean-typed-provider-policy --execute-live --timeout-seconds 300 --output "$env:DCOIR_DOWNLOADS_DIR\issue485-pr486-adversarial-screen-opus-xhigh.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 .github/dcoir_review/scripts/dcoir_review_multilang_adversarial_eval.py --candidate sonnet5-high --max-tokens 32768 --case ps-last-exitcode-overwritten-by-second-native-command --case ps-remoting-missing-using-scope --case ps-vectorized-comparison-any-vs-all --case ps-clean-native-exit-snapshot --case py-reuse-key-omits-policy-version --case py-head-checked-only-before-long-review --case py-clean-refetch-head-before-publication --case gha-pull-request-target-runs-untrusted-head --case gha-privileged-workflow-executes-untrusted-artifact --case gha-clean-untrusted-title-via-env --case md-approval-contract-contradicts-automatic-posting --case md-clean-approval-before-review-sequence --case json-duplicate-security-key-last-wins --case json-clean-typed-provider-policy --execute-live --timeout-seconds 300 --output "$env:DCOIR_DOWNLOADS_DIR\issue485-pr486-adversarial-screen-sonnet-cap32768.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload screen artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr486-adversarial-paid-screen
          path: /tmp/dcoir-downloads/*.json
          if-no-files-found: warn
          retention-days: 14
