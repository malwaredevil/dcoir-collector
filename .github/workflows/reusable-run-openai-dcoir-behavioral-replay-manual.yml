# DCOIR REUSABLE WORKFLOW CONTRACT
# Source entry workflow: run-openai-dcoir-behavioral-replay-manual.yml
# Purpose: reusable exact-head implementation for live GPT-5.6 Terra replay using the governed AFRICOM DCOIR Analyst package.
name: 99 Module - Run OpenAI DCOIR Behavioral Replay Manual
run-name: Module Run OpenAI DCOIR Behavioral Replay | ${{ github.workflow }} | #${{ github.run_number }}

on:
  workflow_call:
    inputs:
      expected_head_sha:
        required: true
        type: string
      target_id:
        required: false
        type: string
        default: openai_dcoir_analyst
      run_all_active_fixtures:
        required: false
        type: boolean
        default: true
      custom_fixtures_csv:
        required: false
        type: string
        default: ''
      reasoning_effort:
        required: false
        type: string
        default: medium
      max_output_tokens:
        description: Blank uses the per-target runner default (8192 DCOIR Analyst, 16384 USB Reporting)
        required: false
        type: string
        default: ''
    secrets:
      DCOIR_OPENAI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      DCOIR_OPENAI_PROJECT_ID:
        required: false
    outputs: {}

permissions:
  contents: read

jobs:
  live_replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DCOIR_OPENAI_API_KEY: ${{ secrets.DCOIR_OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DCOIR_OPENAI_PROJECT_ID: ${{ secrets.DCOIR_OPENAI_PROJECT_ID }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      TARGET_ID: ${{ inputs.target_id }}
      RUN_ALL_ACTIVE_FIXTURES: ${{ inputs.run_all_active_fixtures }}
      CUSTOM_FIXTURES_CSV: ${{ inputs.custom_fixtures_csv }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up workflow runtime
        uses: ./.github/actions/setup-workflow-runtime
        with:
          python-version: '3.11'

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'expected_head_sha must be a full 40-character commit SHA' >&2
            exit 1
          fi
          if [[ "${actual,,}" != "${EXPECTED_HEAD_SHA,,}" ]]; then
            echo "Exact-head guard failed: expected $EXPECTED_HEAD_SHA but checkout is $actual" >&2
            exit 1
          fi
          echo "exact_head=$actual"

      - name: Validate governed OpenAI package and replay contracts
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ID" in
            openai_dcoir_analyst)
              python -m py_compile \
                project_sources/gemini/tools/run_openai_dcoir_behavioral_replay.py \
                project_sources/gemini/tools/openai_dcoir_behavioral_replay_selftest.py \
                project_sources/gemini/tools/lib/openai_dcoir_replay_package.py \
                project_sources/gemini/tools/lib/openai_dcoir_replay_live.py
              python project_sources/agent_runtime/tools/build_openai_dcoir_analyst.py --check
              python project_sources/agent_runtime/tests/build_openai_dcoir_analyst_selftest.py
              python project_sources/gemini/tools/openai_dcoir_behavioral_replay_selftest.py
              ;;
            openai_usb_reporting)
              python -m py_compile \
                project_sources/gemini/tools/run_openai_usb_reporting_behavioral_replay.py \
                project_sources/gemini/tools/openai_usb_reporting_behavioral_replay_selftest.py \
                project_sources/gemini/tools/lib/openai_usb_replay_package.py \
                project_sources/gemini/tools/lib/openai_dcoir_replay_live.py \
                project_sources/agent_runtime/tools/score_usb_reporting_behavior.py
              python project_sources/agent_runtime/tools/build_openai_usb_reporting.py --check
              python project_sources/agent_runtime/tests/build_openai_usb_reporting_selftest.py
              PYTHONPATH=project_sources/gemini/tools \
                python project_sources/gemini/tools/openai_usb_reporting_behavioral_replay_selftest.py
              ;;
            *)
              echo "Unsupported target_id: $TARGET_ID" >&2
              exit 1
              ;;
          esac

      - name: Create output directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ID" == "openai_usb_reporting" ]]; then
            mkdir -p project_sources/validation/out_run_openai_usb_reporting_behavioral_replay_manual
          else
            mkdir -p project_sources/validation/out_run_openai_dcoir_behavioral_replay_manual
          fi

      - name: Run live OpenAI behavioral replay
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ID" in
            openai_dcoir_analyst)
              args=(
                --fixtures-root project_sources/gemini/fixtures/behavioral_replay
                --output-dir project_sources/validation/out_run_openai_dcoir_behavioral_replay_manual
                --custom-fixtures-csv "$CUSTOM_FIXTURES_CSV"
                --reasoning-effort "$REASONING_EFFORT"
              )
              if [[ -n "$MAX_OUTPUT_TOKENS" ]]; then
                args+=(--max-output-tokens "$MAX_OUTPUT_TOKENS")
              fi
              if [[ "$RUN_ALL_ACTIVE_FIXTURES" == "true" ]]; then
                args+=(--run-all-active-fixtures)
              fi
              python project_sources/gemini/tools/run_openai_dcoir_behavioral_replay.py "${args[@]}"
              ;;
            openai_usb_reporting)
              if [[ -n "$CUSTOM_FIXTURES_CSV" || "$RUN_ALL_ACTIVE_FIXTURES" != "true" ]]; then
                echo '::warning::openai_usb_reporting ignores run_all_active_fixtures and custom_fixtures_csv; running the governed default USB fixtures.'
              fi
              usb_args=(
                --output-dir project_sources/validation/out_run_openai_usb_reporting_behavioral_replay_manual
                --reasoning-effort "$REASONING_EFFORT"
              )
              if [[ -n "$MAX_OUTPUT_TOKENS" ]]; then
                usb_args+=(--max-output-tokens "$MAX_OUTPUT_TOKENS")
              fi
              python project_sources/gemini/tools/run_openai_usb_reporting_behavioral_replay.py "${usb_args[@]}"
              ;;
          esac

      - name: Build USB replay report section
        if: ${{ always() && inputs.target_id == 'openai_usb_reporting' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('project_sources/validation/out_run_openai_usb_reporting_behavioral_replay_manual')
          report_path = root / 'openai_usb_reporting_behavioral_replay_run_report.json'
          out = root / 'chatgpt_workflow_report_section.md'
          lines = ['## OpenAI USB Reporting Behavioral Replay']
          if not report_path.is_file():
              lines.append('No USB replay JSON report was produced.')
          else:
              data = json.loads(report_path.read_text(encoding='utf-8'))
              lines.extend([
                  f"- Target: `{data.get('target_id', 'openai_usb_reporting')}`",
                  f"- Model: `{data.get('model_id', 'unknown')}`",
                  f"- Workflow verdict: **{data.get('workflow_verdict', 'unknown')}**",
              ])
              if data.get('error'):
                  lines.append(f"- Error: `{data['error']}`")
              for item in data.get('results', []):
                  lines.append(f"- `{item.get('fixture')}`: **{'pass' if item.get('passed') else 'fail'}**")
                  for stage in ('clarification', 'final'):
                      score = item.get(stage, {}).get('semantic_score', {})
                      for error in score.get('errors', []):
                          lines.append(f"  - {stage}: {error}")
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publish replay summary to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ID" == "openai_usb_reporting" ]]; then
            report="project_sources/validation/out_run_openai_usb_reporting_behavioral_replay_manual/chatgpt_workflow_report_section.md"
            label='OpenAI USB Reporting Behavioral Replay'
          else
            report="project_sources/validation/out_run_openai_dcoir_behavioral_replay_manual/chatgpt_workflow_report_section.md"
            label='OpenAI DCOIR Behavioral Replay'
          fi
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## $label" >> "$GITHUB_STEP_SUMMARY"
            echo 'No replay report section was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live replay artifacts
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: run-openai-dcoir-behavioral-replay-manual-results
          path: |
            project_sources/validation/out_run_openai_dcoir_behavioral_replay_manual/**
            project_sources/validation/out_run_openai_usb_reporting_behavioral_replay_manual/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ChatGPT workflow report section
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: chatgpt-workflow-report-section
          path: |
            project_sources/validation/out_run_openai_dcoir_behavioral_replay_manual/chatgpt_workflow_report_section.md
            project_sources/validation/out_run_openai_usb_reporting_behavioral_replay_manual/chatgpt_workflow_report_section.md
          if-no-files-found: warn
          retention-days: 14
