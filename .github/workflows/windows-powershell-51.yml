# DCOIR WORKFLOW OPERATOR NOTES
# Workflow key:
# - workflow-validation-windows-powershell-51-0016
# Purpose:
# - Validate PowerShell parser compatibility and supporting collector Pester behavior through Windows PowerShell 5.1 on a Windows runner.
# Use when:
# - Use after PowerShell, collector harness, workflow, Codex helper, or validation-script changes where Windows PowerShell 5.1 behavior matters.
# Do not use when:
# - Do not treat this as a replacement for collector runtime harness validation or Linux PowerShell 7 cross-platform checks.
# Trigger model:
# - pull_request and push paths for PowerShell files, Pester surfaces, the collector runtime manifest, validation wrappers, GitHub workflow YAML files, and this workflow pair; workflow_dispatch for operator-requested checks.
# Required inputs:
# - none
# Required secrets/config:
# - none
# Runtime dependencies:
# - Uses Windows PowerShell Desktop through shell: powershell, the repo-local parser wrapper, and the pinned DCOIR Pester composite action.
# Expected outputs/readback:
# - ChatGPT workflow report section plus NUnit Pester artifact with engine, Pester version, and test counts.
# Safety notes:
# - A pass confirms parser compatibility and the bounded Pester suite under Windows PowerShell 5.1, not full collector harness or static-analysis behavior.
# Maintenance notes:
# - Keep this header aligned with executable behavior whenever triggers, inputs, scripts, reports, artifacts, permissions, or safety checks change.
# - Keep this header aligned with current repo-root GitHub guidance and the active `ircore` operating model when authority or routing language changes.
# Authority routing:
# - GitHub is canonical for workflow/source truth and this header owns workflow-specific execution guidance.
# - Supabase `ircore` owns operational routing, validation rules, reusable lessons, and active state.
# - Treat Airtable references as historical evidence only; active workflow routing must not depend on Airtable.
name: 26 Validation - Windows PowerShell 5.1
run-name: Windows PowerShell 5.1 | #${{ github.run_number }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'scripts/validate-windows-powershell-51.ps1'
      - 'scripts/validate-codex-local.sh'
      - '.github/actions/validate-powershell-syntax/**'
      - '.github/actions/run-dcoir-pester/**'
      - '.github/pester/**'
      - 'project_sources/collector/manifests/Collector_Runtime_Package_Manifest.json'
      - '.github/actions/upload-chatgpt-artifact/**'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/windows-powershell-51.yml'
      - '.github/workflows/reusable-windows-powershell-51.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'scripts/validate-windows-powershell-51.ps1'
      - 'scripts/validate-codex-local.sh'
      - '.github/actions/validate-powershell-syntax/**'
      - '.github/actions/run-dcoir-pester/**'
      - '.github/pester/**'
      - 'project_sources/collector/manifests/Collector_Runtime_Package_Manifest.json'
      - '.github/actions/upload-chatgpt-artifact/**'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/windows-powershell-51.yml'
      - '.github/workflows/reusable-windows-powershell-51.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-powershell-51-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-windows-powershell-51.yml
    permissions:
      contents: read
    with:
      caller_event_name: ${{ github.event_name }}
