name: Temporary PR486 v11 paired Sonnet Opus control eval fork1b

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run:
    if: github.event.head_commit.message == 'Temporary PR486 v11 paired Sonnet Opus control eval fork1b'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ae189a78e7fb44842c7ca2d918fe1c81d4f82ec6
          persist-credentials: false

      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "ae189a78e7fb44842c7ca2d918fe1c81d4f82ec6"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Deterministic v11 gate with no inference credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          unset OPENROUTER_API_KEY DCOIR_OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY OPENAI_API_KEY DCOIR_OPENAI_API_KEY DCOIR_GEMINI_API
          python -m py_compile \
            .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v11.py \
            .github/dcoir_review/scripts/dcoir_review_pr_precision_fixture_v11_selftest.py
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_fixture_v11_selftest.py
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v11.py \
            --candidate sonnet5-high \
            --max-tokens 32768 \
            --case precision-gha-fork-grammar-aligned-checkout-approved-tested \
            --output "$RUNNER_TEMP/pr486-v11-sonnet-fork1b-plan.json"
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v11.py \
            --candidate opus5-xhigh-control \
            --max-tokens 65536 \
            --case precision-gha-fork-grammar-aligned-checkout-approved-tested \
            --output "$RUNNER_TEMP/pr486-v11-opus-fork1b-plan.json"
          python - <<'PY'
          import json
          import os
          expected_case = ['precision-gha-fork-grammar-aligned-checkout-approved-tested']
          checks = [
              ('pr486-v11-sonnet-fork1b-plan.json', ['sonnet5-high']),
              ('pr486-v11-opus-fork1b-plan.json', ['opus5-xhigh-control']),
          ]
          for filename, expected_candidate in checks:
              path = os.path.join(os.environ['RUNNER_TEMP'], filename)
              with open(path, encoding='utf-8') as handle:
                  report = json.load(handle)
              assert report.get('mode') == 'plan', (filename, report.get('mode'))
              assert int(report.get('network_requests_made', -1)) == 0, (filename, report.get('network_requests_made'))
              assert int(report.get('planned_requests', -1)) == 1, (filename, report.get('planned_requests'))
              assert report.get('selected_candidate_ids') == expected_candidate, (filename, report.get('selected_candidate_ids'))
              assert report.get('selected_case_ids') == expected_case, (filename, report.get('selected_case_ids'))
          print('v11 fork1b deterministic plans verified: zero network, one Sonnet plan, one Opus plan')
          PY

      - name: Run approved one-request Sonnet v11 confirmation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DCOIR_EVAL_REQUEST_CHECKPOINT="$RUNNER_TEMP/pr486-v11-sonnet-fork1b-calls.jsonl" \
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v11.py \
            --candidate sonnet5-high \
            --max-tokens 32768 \
            --timeout-seconds 300 \
            --execute-live \
            --case precision-gha-fork-grammar-aligned-checkout-approved-tested \
            --output "$RUNNER_TEMP/pr486-v11-sonnet-fork1b-report.json"
          test "$(wc -l < "$RUNNER_TEMP/pr486-v11-sonnet-fork1b-calls.jsonl")" -eq 1

      - name: Run approved one-request Opus v11 control
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DCOIR_EVAL_REQUEST_CHECKPOINT="$RUNNER_TEMP/pr486-v11-opus-fork1b-calls.jsonl" \
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval_v11.py \
            --candidate opus5-xhigh-control \
            --max-tokens 65536 \
            --timeout-seconds 300 \
            --execute-live \
            --case precision-gha-fork-grammar-aligned-checkout-approved-tested \
            --output "$RUNNER_TEMP/pr486-v11-opus-fork1b-report.json"
          test "$(wc -l < "$RUNNER_TEMP/pr486-v11-opus-fork1b-calls.jsonl")" -eq 1

      - name: Verify paired request count
        run: |
          test "$(wc -l < "$RUNNER_TEMP/pr486-v11-sonnet-fork1b-calls.jsonl")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/pr486-v11-opus-fork1b-calls.jsonl")" -eq 1
          test "$(( $(wc -l < "$RUNNER_TEMP/pr486-v11-sonnet-fork1b-calls.jsonl") + $(wc -l < "$RUNNER_TEMP/pr486-v11-opus-fork1b-calls.jsonl") ))" -eq 2

      - name: Upload bounded paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr486-v11-paired-fork1b-evidence
          path: |
            ${{ runner.temp }}/pr486-v11-sonnet-fork1b-plan.json
            ${{ runner.temp }}/pr486-v11-sonnet-fork1b-report.json
            ${{ runner.temp }}/pr486-v11-sonnet-fork1b-calls.jsonl
            ${{ runner.temp }}/pr486-v11-opus-fork1b-plan.json
            ${{ runner.temp }}/pr486-v11-opus-fork1b-report.json
            ${{ runner.temp }}/pr486-v11-opus-fork1b-calls.jsonl
          if-no-files-found: warn
