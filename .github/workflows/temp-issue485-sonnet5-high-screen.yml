# trigger: operator-approved five-request Sonnet 5/high screen
name: Temporary Issue 485 Sonnet 5 High Screen

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-issue485-sonnet5-high-screen.yml

permissions:
  contents: read

jobs:
  sonnet5-high-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DCOIR_DOWNLOADS_DIR: ${{ runner.temp }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: 168b66a43620d5b68b124d889ef280e49b36df5e
          fetch-depth: 1

      - name: Verify exact corpus head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '168b66a43620d5b68b124d889ef280e49b36df5e') {
            throw "Unexpected checkout: $actual"
          }

      - name: Run exact approved five-request screen
        shell: pwsh
        run: |
          python3 .github/dcoir_review/scripts/dcoir_review_first_pass_candidate_eval.py --candidate sonnet5-high --execute-live --case pr448-lane-separation-binding --case pr448-numbered-lifecycle-duplicate --case rejected-proposition-sibling-branch --case membership-expression-after-or --case documented-mode-label-without-runtime-claim --timeout-seconds 300 --output "$env:DCOIR_DOWNLOADS_DIR\issue485-pr486-sonnet5-high-screen.json"

      - name: Verify result artifact exists
        shell: pwsh
        run: |
          $path = Join-Path $env:DCOIR_DOWNLOADS_DIR 'issue485-pr486-sonnet5-high-screen.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Expected result file not found: $path"
          }

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue485-pr486-sonnet5-high-screen
          path: ${{ runner.temp }}/issue485-pr486-sonnet5-high-screen.json
          if-no-files-found: warn
          retention-days: 7
