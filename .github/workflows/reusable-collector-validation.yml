# DCOIR reusable workflow module.
# Entry workflows keep triggers, permissions, concurrency, and operator-facing inputs.
name: 99 Module - Collector Validation
run-name: Module Collector Validation | ${{ github.workflow }} | #${{ github.run_number }}

on:
  workflow_call:
    inputs:
      workflow_name:
        description: Entry workflow name for reports.
        required: true
        type: string
      surface_profile:
        description: check_required_surfaces.py profile.
        required: true
        type: string
      validation_prefix:
        description: Output suffix used for project_sources/validation/out_<prefix> paths.
        required: true
        type: string
      artifact_name:
        description: Primary artifact name.
        required: true
        type: string
      artifact_paths:
        description: Newline-separated artifact path set.
        required: true
        type: string
      artifact_retention_days:
        description: Primary artifact retention.
        required: false
        default: 14
        type: number
      report_title:
        description: ChatGPT report title.
        required: true
        type: string
      report_scope:
        description: Short validation scope for the ChatGPT report.
        required: true
        type: string
      report_note:
        description: Artifact note for the ChatGPT report.
        required: true
        type: string
      report_claim:
        description: Bounded claim guidance for the ChatGPT report.
        required: true
        type: string
      run_required_surfaces:
        required: false
        default: true
        type: boolean
      run_packaging_residue_check:
        required: false
        default: false
        type: boolean
      run_documentation_self_tests:
        required: false
        default: true
        type: boolean
      run_windows_powershell_5_1_syntax:
        required: false
        default: false
        type: boolean
      run_harness_assembly_parity:
        required: false
        default: true
        type: boolean
      run_validate_dcoir_fixtures:
        required: false
        default: true
        type: boolean
      run_documentation_quality:
        required: false
        default: true
        type: boolean
      run_powershell_review_assist:
        required: false
        default: true
        type: boolean
      run_gemini_smoke_build:
        required: false
        default: true
        type: boolean
      run_agent_package_validation:
        description: Run the governed shared agent-runtime contract plus both OpenAI GPT package and combined deployment-release validation.
        required: false
        default: false
        type: boolean
      run_gemini_behavioral_replay_validation:
        description: Run the deterministic Gemini behavioral replay validation suite.
        required: false
        default: false
        type: boolean
      run_gemini_production_like_harness_validation:
        description: Run the static/construct Gemini production-like harness validator.
        required: false
        default: false
        type: boolean
      gemini_production_like_harness_mode:
        description: Gemini production-like harness depth when enabled.
        required: false
        default: medium
        type: string
      run_collector_package_smoke:
        required: false
        default: false
        type: boolean
      run_collector_runtime_package_validation:
        required: false
        default: false
        type: boolean
      collector_runtime_package_validation_output_dir:
        required: false
        default: 'project_sources/validation/out_collector_runtime_package_validation'
        type: string
      build_runtime_for_harness:
        required: false
        default: false
        type: boolean
      run_harness_suite:
        required: false
        default: false
        type: boolean
      harness_suite:
        required: false
        default: Core
        type: string
      harness_output_root:
        description: Output root passed to the collector harness.
        required: false
        default: '.\TestResults'
        type: string
      run_dcoir_pester:
        required: false
        default: false
        type: boolean
      dcoir_pester_version:
        required: false
        default: '5.7.1'
        type: string
      dcoir_pester_result_path:
        required: false
        default: 'project_sources/TestResults/pester-collector-validation.xml'
        type: string
      dcoir_pester_minimum_test_count:
        required: false
        default: '45'
        type: string
      enforce_fullregression_mission_readiness:
        required: false
        default: false
        type: boolean
      mission_readiness_json_output:
        required: false
        default: ''
        type: string
      mission_readiness_markdown_output:
        required: false
        default: ''
        type: string

    outputs: {}
    secrets: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up workflow runtime
        uses: ./.github/actions/setup-workflow-runtime
        with:
          setup-python: 'false'

      - name: Set up Python runtime
        uses: ./.github/actions/setup-python-runtime
        with:
          python-version: "3.11"

      - name: Check required governed surfaces
        if: ${{ inputs.run_required_surfaces }}
        uses: ./.github/actions/verify-required-surfaces
        with:
          profile: ${{ inputs.surface_profile }}

      - name: Check for packaging residue
        if: ${{ inputs.run_packaging_residue_check }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $residue = Get-ChildItem -Path . -Recurse -Force -File |
            Where-Object {
              $_.FullName.Contains('\__pycache__\') -or
              $_.Extension -eq '.pyc' -or
              $_.Name -eq '.DS_Store'
            }
          if ($residue) {
            $residue | ForEach-Object { Write-Error $_.FullName }
            throw 'Packaging residue found in working tree.'
          }

      - name: Validate Python syntax
        uses: ./.github/actions/validate-python-syntax

      - name: Run governed agent-runtime validation contract
        if: ${{ inputs.run_agent_package_validation }}
        shell: pwsh
        env:
          VALIDATION_PREFIX: ${{ inputs.validation_prefix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = @(
            @('Shared source contract', 'python', 'project_sources/agent_runtime/tools/validate_shared_agent_source_contract.py'),
            @('Shared source contract self-tests', 'python', 'project_sources/agent_runtime/tests/validate_shared_agent_source_contract_selftest.py'),
            @('Behavior adapter materialization check', 'python', 'project_sources/agent_runtime/tools/materialize_agent_behavior_adapters.py', '--check'),
            @('Behavior adapter self-tests', 'python', 'project_sources/agent_runtime/tests/materialize_agent_behavior_adapters_selftest.py'),
            @('Knowledge projection check', 'python', 'project_sources/agent_runtime/tools/project_agent_knowledge.py', '--check'),
            @('Knowledge projection self-tests', 'python', 'project_sources/agent_runtime/tests/project_agent_knowledge_selftest.py'),
            @('OpenAI DCOIR package check', 'python', 'project_sources/agent_runtime/tools/build_openai_dcoir_analyst.py', '--check'),
            @('OpenAI DCOIR package self-tests', 'python', 'project_sources/agent_runtime/tests/build_openai_dcoir_analyst_selftest.py'),
            @('OpenAI USB package check', 'python', 'project_sources/agent_runtime/tools/build_openai_usb_reporting.py', '--check'),
            @('OpenAI USB package self-tests', 'python', 'project_sources/agent_runtime/tests/build_openai_usb_reporting_selftest.py')
          )
          foreach ($command in $commands) {
            $label = $command[0]
            $exe = $command[1]
            $arguments = @($command[2..($command.Count - 1)])
            Write-Host "=== $label ==="
            & $exe $arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$label failed with exit $LASTEXITCODE"
            }
          }

          $outputDir = "project_sources/validation/out_$($env:VALIDATION_PREFIX)_agent_runtime"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $receiptCommands = @(
            'python project_sources/agent_runtime/tools/validate_shared_agent_source_contract.py',
            'python project_sources/agent_runtime/tests/validate_shared_agent_source_contract_selftest.py',
            'python project_sources/agent_runtime/tools/materialize_agent_behavior_adapters.py --check',
            'python project_sources/agent_runtime/tests/materialize_agent_behavior_adapters_selftest.py',
            'python project_sources/agent_runtime/tools/project_agent_knowledge.py --check',
            'python project_sources/agent_runtime/tests/project_agent_knowledge_selftest.py',
            'python project_sources/agent_runtime/tools/build_openai_dcoir_analyst.py --check',
            'python project_sources/agent_runtime/tests/build_openai_dcoir_analyst_selftest.py',
            'python project_sources/agent_runtime/tools/build_openai_usb_reporting.py --check',
            'python project_sources/agent_runtime/tests/build_openai_usb_reporting_selftest.py'
          )
          $receipt = [ordered]@{
            schema_version = 'dcoir_agent_runtime_validation_workflow_receipt_v1'
            workflow = '${{ inputs.workflow_name }}'
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            head_sha = $env:GITHUB_SHA
            tested_commit_sha = $env:GITHUB_SHA
            event_name = $env:GITHUB_EVENT_NAME
            documented_contract = 'project_sources/agent_runtime/README.md'
            command_count = $receiptCommands.Count
            commands = @($receiptCommands | ForEach-Object { [ordered]@{ command = $_; result = 'pass' } })
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $outputDir 'agent_runtime_validation.json') -Encoding utf8

      - name: Validate combined OpenAI GPT deployment packages
        if: ${{ inputs.run_agent_package_validation }}
        shell: pwsh
        env:
          VALIDATION_PREFIX: ${{ inputs.validation_prefix }}
        run: |
          $ErrorActionPreference = 'Stop'
          python project_sources/agent_runtime/tests/build_openai_gpt_deployment_release_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Combined OpenAI GPT deployment release self-tests failed.'
          }
          python project_sources/agent_runtime/tests/build_openai_gpt_deployment_release_issue428_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Issue #428 OpenAI GPT deployment release self-tests failed.'
          }

          $outputDir = "project_sources/validation/out_$($env:VALIDATION_PREFIX)_openai_gpt"
          $parityRoot = Join-Path $outputDir 'parity'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          python project_sources/agent_runtime/tools/report_agent_release_parity.py `
            --source-commit $env:GITHUB_SHA `
            --output-root $parityRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Unified agent release/parity report failed.'
          }
          python project_sources/agent_runtime/tools/build_openai_gpt_deployment_release.py `
            --source-commit $env:GITHUB_SHA `
            --output-dir $outputDir `
            --parity-root $parityRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Combined OpenAI GPT deployment release build failed.'
          }

      - name: Run documentation validator self-tests
        if: ${{ inputs.run_documentation_self_tests }}
        shell: pwsh
        run: |
          python project_sources/collector/tools/test_verify_collector_documentation_quality.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Documentation validator self-tests failed.'
          }

      - name: Validate PowerShell syntax
        uses: ./.github/actions/validate-powershell-syntax

      - name: Validate Windows PowerShell 5.1 syntax
        if: ${{ inputs.run_windows_powershell_5_1_syntax }}
        uses: ./.github/actions/validate-powershell-syntax
        with:
          use-windows-powershell: "true"

      - name: Assemble generated collector harness
        if: ${{ inputs.run_harness_assembly_parity || inputs.run_harness_suite }}
        uses: ./.github/actions/assemble-collector-harness

      - name: Validate generated harness Windows PowerShell 5.1 syntax
        if: ${{ (inputs.run_harness_assembly_parity || inputs.run_harness_suite) && inputs.run_windows_powershell_5_1_syntax }}
        uses: ./.github/actions/validate-powershell-syntax
        with:
          paths: |
            project_sources/collector/harness/run_DCOIR_Tests.generated.ps1
          require-files: "true"
          use-windows-powershell: "true"

      - name: Run DCOIR Collector Pester tests
        if: ${{ inputs.run_dcoir_pester }}
        id: pester
        uses: ./.github/actions/run-dcoir-pester
        with:
          pester-version: ${{ inputs.dcoir_pester_version }}
          result-path: ${{ inputs.dcoir_pester_result_path }}
          minimum-test-count: ${{ inputs.dcoir_pester_minimum_test_count }}

      - name: Run validate_DCOIR_Run fixture tests
        if: ${{ inputs.run_validate_dcoir_fixtures }}
        uses: ./.github/actions/run-validate-dcoir-fixtures
        with:
          output-root: .\validation\out_${{ inputs.validation_prefix }}_validate_dcoir_run_fixtures

      - name: Run collector documentation quality gate
        if: ${{ inputs.run_documentation_quality }}
        uses: ./.github/actions/run-collector-documentation-quality
        with:
          output-json: project_sources/validation/out_${{ inputs.validation_prefix }}_documentation_quality/collector_documentation_quality.json

      - name: Run PowerShell review-assist report
        if: ${{ inputs.run_powershell_review_assist }}
        uses: ./.github/actions/run-powershell-review-assist
        with:
          json-output: project_sources/collector/powershell_review_assist_${{ inputs.validation_prefix }}_workflow_report.json
          markdown-output: project_sources/collector/powershell_review_assist_${{ inputs.validation_prefix }}_workflow_report.md

      - name: Smoke-test collector runtime package build
        if: ${{ inputs.run_collector_package_smoke }}
        uses: ./.github/actions/smoke-build-collector-package
        with:
          output-dir: project_sources/validation/out_${{ inputs.validation_prefix }}_collector

      - name: Run collector runtime package validation
        if: ${{ inputs.run_collector_runtime_package_validation }}
        uses: ./.github/actions/run-collector-runtime-package-validation
        with:
          output-dir: ${{ inputs.collector_runtime_package_validation_output_dir }}

      - name: Build fresh collector runtime zip for harness
        if: ${{ inputs.build_runtime_for_harness }}
        uses: ./.github/actions/build-collector-runtime-for-harness
        with:
          output-dir: project_sources/validation/out_${{ inputs.validation_prefix }}_collector

      - name: Run selected collector harness suite
        if: ${{ inputs.run_harness_suite }}
        shell: pwsh
        timeout-minutes: 120
        working-directory: project_sources
        env:
          SELECTED_HARNESS_SUITE: ${{ inputs.harness_suite }}
          HARNESS_OUTPUT_ROOT: ${{ inputs.harness_output_root }}
        run: |
          $suite = $env:SELECTED_HARNESS_SUITE
          $harnessOutputRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $env:HARNESS_OUTPUT_ROOT))
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\collector\harness\run_DCOIR_Tests.generated.ps1 -CollectorPath $env:HARNESS_COLLECTOR_PATH -Suite $suite -OutputRoot $harnessOutputRoot -MasterZipPath $env:HARNESS_RUNTIME_ZIP -CollectorStepTimeoutSeconds 600
          if ($LASTEXITCODE -ne 0) {
            throw "Collector harness suite failed: $suite"
          }

      - name: Smoke-test Gemini bundle build
        if: ${{ inputs.run_gemini_smoke_build }}
        uses: ./.github/actions/smoke-build-gemini-bundle
        with:
          output-dir: project_sources/validation/out_${{ inputs.validation_prefix }}_gemini

      - name: Run deterministic Gemini behavioral replay validation
        if: ${{ inputs.run_gemini_behavioral_replay_validation }}
        shell: pwsh
        env:
          VALIDATION_PREFIX: ${{ inputs.validation_prefix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = "project_sources/validation/out_$($env:VALIDATION_PREFIX)_gemini_replay"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          python project_sources/gemini/tools/run_gemini_behavioral_replay_validation_suite.py `
            --fixtures-root project_sources/gemini/fixtures/behavioral_replay `
            --output-dir $outputDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Deterministic Gemini behavioral replay validation failed.'
          }

      - name: Run Gemini production-like harness validation
        if: ${{ inputs.run_gemini_production_like_harness_validation }}
        shell: pwsh
        timeout-minutes: 30
        env:
          VALIDATION_PREFIX: ${{ inputs.validation_prefix }}
          GEMINI_HARNESS_MODE: ${{ inputs.gemini_production_like_harness_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = "project_sources/validation/out_$($env:VALIDATION_PREFIX)_gemini_production_like"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          python project_sources/gemini/tools/validate_gemini_production_like_harness.py `
            --repo-root . `
            --fixtures-root project_sources/gemini/fixtures/behavioral_replay `
            --output-dir $outputDir `
            --mode $env:GEMINI_HARNESS_MODE
          if ($LASTEXITCODE -ne 0) {
            throw 'Gemini production-like harness validation failed.'
          }

      - name: Enforce FullRegression mission-readiness gate
        if: ${{ inputs.enforce_fullregression_mission_readiness }}
        shell: pwsh
        env:
          SELECTED_HARNESS_SUITE: ${{ inputs.harness_suite }}
          HARNESS_OUTPUT_ROOT: ${{ inputs.harness_output_root }}
          MISSION_READINESS_JSON_OUTPUT: ${{ inputs.mission_readiness_json_output }}
          MISSION_READINESS_MARKDOWN_OUTPUT: ${{ inputs.mission_readiness_markdown_output }}
        run: |
          .\.github\dcoir_review\scripts\test-collector-fullregression-mission-readiness.ps1 `
            -HarnessOutputRoot $env:HARNESS_OUTPUT_ROOT `
            -SelectedSuite $env:SELECTED_HARNESS_SUITE `
            -JsonOutputPath $env:MISSION_READINESS_JSON_OUTPUT `
            -MarkdownOutputPath $env:MISSION_READINESS_MARKDOWN_OUTPUT

      - name: Upload validation artifacts
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Write ChatGPT workflow report section
        if: always()
        shell: pwsh
        env:
          REPORT_TITLE: ${{ inputs.report_title }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          REPORT_SCOPE: ${{ inputs.report_scope }}
          PRIMARY_ARTIFACT: ${{ inputs.artifact_name }}
          REPORT_NOTE: ${{ inputs.report_note }}
          REPORT_CLAIM: ${{ inputs.report_claim }}
          SELECTED_HARNESS_SUITE: ${{ inputs.harness_suite }}
          AGENT_PACKAGE_VALIDATION: ${{ inputs.run_agent_package_validation }}
          GEMINI_REPLAY_VALIDATION: ${{ inputs.run_gemini_behavioral_replay_validation }}
          GEMINI_PRODUCTION_LIKE_VALIDATION: ${{ inputs.run_gemini_production_like_harness_validation }}
          GEMINI_PRODUCTION_LIKE_MODE: ${{ inputs.gemini_production_like_harness_mode }}
          PESTER_VERSION: ${{ steps.pester.outputs.pester_version }}
          PESTER_TOTAL: ${{ steps.pester.outputs.total_count }}
          PESTER_PASSED: ${{ steps.pester.outputs.passed_count }}
          PESTER_FAILED: ${{ steps.pester.outputs.failed_count }}
          PESTER_SKIPPED: ${{ steps.pester.outputs.skipped_count }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path chatgpt_workflow_report_section | Out-Null
          @"
          ## $env:REPORT_TITLE

          - workflow: $env:WORKFLOW_NAME
          - validation_scope: $env:REPORT_SCOPE
          - workflow_run_id: $env:GITHUB_RUN_ID
          - workflow_run_attempt: $env:GITHUB_RUN_ATTEMPT
          - head_sha: $env:GITHUB_SHA
          - ref: $env:GITHUB_REF
          - event_name: $env:GITHUB_EVENT_NAME
          - selected_harness_suite: $env:SELECTED_HARNESS_SUITE
          - agent_package_validation: $env:AGENT_PACKAGE_VALIDATION
          - gemini_behavioral_replay_validation: $env:GEMINI_REPLAY_VALIDATION
          - gemini_production_like_harness_validation: $env:GEMINI_PRODUCTION_LIKE_VALIDATION
          - gemini_production_like_harness_mode: $env:GEMINI_PRODUCTION_LIKE_MODE
          - primary_artifact: $env:PRIMARY_ARTIFACT
          - artifact_note: $env:REPORT_NOTE
          - pester_version: $env:PESTER_VERSION
          - pester_total: $env:PESTER_TOTAL
          - pester_passed: $env:PESTER_PASSED
          - pester_failed: $env:PESTER_FAILED
          - pester_skipped: $env:PESTER_SKIPPED

          $env:REPORT_CLAIM
          "@ | Set-Content -Path chatgpt_workflow_report_section/chatgpt_workflow_report_section.md -Encoding utf8

      - name: Upload ChatGPT workflow report section
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: chatgpt-workflow-report-section
          path: chatgpt_workflow_report_section/chatgpt_workflow_report_section.md
          if-no-files-found: error
          retention-days: 14
