name: 98 Temp - PR486 clean precision v2 paid
run-name: PR486 clean precision v2 | target f4b0afc23dfc4b3e1bb0540abc74a403c518f1d1

on:
  push:
    branches:
      - issue-485-first-pass-model-eval-harness
    paths:
      - '.github/workflows/temp-pr486-clean-precision-v2-paid.yml'

permissions:
  contents: read

jobs:
  paid-clean-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f4b0afc23dfc4b3e1bb0540abc74a403c518f1d1
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare artifact directory
        run: mkdir -p /tmp/dcoir-downloads
      - name: Run Sonnet high capped clean-precision v2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DCOIR_EVAL_REQUEST_CHECKPOINT: /tmp/dcoir-downloads/clean-precision-v2-sonnet-checkpoint.jsonl
        run: |
          python3 .github/dcoir_review/scripts/dcoir_review_pr_precision_eval.py \
            --candidate sonnet5-high \
            --max-tokens 32768 \
            --execute-live --timeout-seconds 300 \
            --output /tmp/dcoir-downloads/clean-precision-v2-sonnet.json
      - name: Run Opus xhigh clean-precision v2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DCOIR_EVAL_REQUEST_CHECKPOINT: /tmp/dcoir-downloads/clean-precision-v2-opus-checkpoint.jsonl
        run: |
          python3 .github/dcoir_review/scripts/dcoir_review_pr_precision_eval.py \
            --candidate opus5-xhigh-control \
            --max-tokens 32768 \
            --execute-live --timeout-seconds 300 \
            --output /tmp/dcoir-downloads/clean-precision-v2-opus.json
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr486-clean-precision-v2-paid
          path: |
            /tmp/dcoir-downloads/*.json
            /tmp/dcoir-downloads/*.jsonl
          if-no-files-found: error
          retention-days: 14
