name: Temporary PR486 v3 Sonnet S1 paid eval

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dcoir-openrouter-paid-eval
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event.head_commit.message == 'PR486 v3 Sonnet S1 paid eval'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run approved five-case Sonnet S1 batch
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DCOIR_EVAL_REQUEST_CHECKPOINT: ${{ runner.temp }}/pr486-v3-sonnet-s1-calls.jsonl
        run: |
          python .github/dcoir_review/scripts/dcoir_review_pr_precision_eval.py \
            --candidate sonnet5-high \
            --max-tokens 32768 \
            --timeout-seconds 300 \
            --execute-live \
            --case precision-ps-remoting-argumentlist-tested \
            --case precision-py-cache-key-callers-tested \
            --case precision-py-subprocess-argv-tested \
            --case precision-gha-title-via-env-approved-tested \
            --case precision-gha-fork-readonly-approved-tested \
            --output "$RUNNER_TEMP/pr486-v3-sonnet-s1-report.json"

      - name: Upload S1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr486-v3-sonnet-s1-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/pr486-v3-sonnet-s1-report.json
            ${{ runner.temp }}/pr486-v3-sonnet-s1-calls.jsonl
