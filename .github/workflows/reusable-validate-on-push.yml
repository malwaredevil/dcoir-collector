# DCOIR REUSABLE WORKFLOW CONTRACT
# Source entry workflow: validate-on-push.yml
# Purpose: reusable implementation module for validate-on-push, including the eight-command shared agent-runtime contract; entry workflow retains triggers, permissions, concurrency, and operator-visible contract notes.
name: 99 Module - Validate On Push
run-name: Module Validate On Push | ${{ github.workflow }} | #${{ github.run_number }}

on:
  workflow_call:
    inputs:
      caller_event_name:
        description: Original caller event name so the reusable body can preserve push/workflow_dispatch/workflow_run branching.
        required: false
        type: string
        default: 'workflow_call'
    outputs: {}
    secrets: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up workflow runtime
        uses: ./.github/actions/setup-workflow-runtime
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        uses: ./.github/actions/validate-python-syntax

      - name: Validate shared agent source contract
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tools/validate_shared_agent_source_contract.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Shared agent source contract validation failed.'
          }

      - name: Run shared agent source contract self-tests
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tests/validate_shared_agent_source_contract_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Shared agent source contract self-tests failed.'
          }

      - name: Verify agent behavior adapter materialization
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tools/materialize_agent_behavior_adapters.py --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Agent behavior adapter materialization check failed.'
          }

      - name: Run agent behavior adapter self-tests
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tests/materialize_agent_behavior_adapters_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Agent behavior adapter self-tests failed.'
          }

      - name: Verify agent knowledge projection
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tools/project_agent_knowledge.py --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Agent knowledge projection check failed.'
          }

      - name: Run agent knowledge projection self-tests
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tests/project_agent_knowledge_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Agent knowledge projection self-tests failed.'
          }

      - name: Verify OpenAI DCOIR package materialization
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tools/build_openai_dcoir_analyst.py --check
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenAI DCOIR package materialization check failed.'
          }

      - name: Run OpenAI DCOIR package self-tests
        shell: pwsh
        run: |
          python project_sources/agent_runtime/tests/build_openai_dcoir_analyst_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenAI DCOIR package self-tests failed.'
          }

      - name: Write agent-runtime validation receipt
        shell: pwsh
        env:
          AGENT_RUNTIME_REVIEWED_HEAD_SHA: ${{ github.sha }}
          AGENT_RUNTIME_TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          $commands = @(
            'python project_sources/agent_runtime/tools/validate_shared_agent_source_contract.py'
            'python project_sources/agent_runtime/tests/validate_shared_agent_source_contract_selftest.py'
            'python project_sources/agent_runtime/tools/materialize_agent_behavior_adapters.py --check'
            'python project_sources/agent_runtime/tests/materialize_agent_behavior_adapters_selftest.py'
            'python project_sources/agent_runtime/tools/project_agent_knowledge.py --check'
            'python project_sources/agent_runtime/tests/project_agent_knowledge_selftest.py'
            'python project_sources/agent_runtime/tools/build_openai_dcoir_analyst.py --check'
            'python project_sources/agent_runtime/tests/build_openai_dcoir_analyst_selftest.py'
          )
          $receipt = [ordered]@{
            schema_version = 'dcoir_agent_runtime_validation_workflow_receipt_v1'
            workflow = 'validate-on-push'
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            head_sha = $env:AGENT_RUNTIME_REVIEWED_HEAD_SHA
            tested_commit_sha = $env:AGENT_RUNTIME_TESTED_COMMIT_SHA
            event_name = $env:GITHUB_EVENT_NAME
            documented_contract = 'project_sources/agent_runtime/README.md'
            command_count = $commands.Count
            commands = @($commands | ForEach-Object { [ordered]@{ command = $_; result = 'pass' } })
          }
          New-Item -ItemType Directory -Force -Path project_sources/validation/out_validate_on_push_agent_runtime | Out-Null
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -Path project_sources/validation/out_validate_on_push_agent_runtime/agent_runtime_validation.json -Encoding utf8

      - name: Run documentation validator self-tests
        shell: pwsh
        run: |
          python project_sources/collector/tools/test_verify_collector_documentation_quality.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Documentation validator self-tests failed.'
          }

      - name: Run duplicate-function action contract tests
        shell: pwsh
        run: |
          python .github/github_actions/tools/test_duplicate_function_action_contract.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Duplicate-function action contract tests failed.'
          }

      - name: Run DCOIR Review runtime module-loader selftest
        shell: pwsh
        run: |
          python .github/dcoir_review/scripts/dcoir_review_runtime_module_loader_selftest.py
          if ($LASTEXITCODE -ne 0) {
            throw 'DCOIR Review runtime module-loader selftest failed.'
          }

      - name: Validate PowerShell syntax
        uses: ./.github/actions/validate-powershell-syntax

      - name: Assemble generated collector harness
        uses: ./.github/actions/assemble-collector-harness

      - name: Verify required governed surfaces
        uses: ./.github/actions/verify-required-surfaces
        with:
          profile: validate_on_push

      - name: Smoke-test Gemini bundle build algorithm
        uses: ./.github/actions/smoke-build-gemini-bundle
        with:
          output-dir: project_sources/validation/out_validate_on_push_gemini

      - name: Smoke-test collector runtime package build
        uses: ./.github/actions/smoke-build-collector-package
        with:
          output-dir: project_sources/validation/out_validate_on_push_collector

      - name: Run validate_DCOIR_Run fixture tests
        uses: ./.github/actions/run-validate-dcoir-fixtures
        with:
          output-root: .\validation\out_validate_on_push_validate_dcoir_run_fixtures

      - name: Run collector documentation quality gate
        uses: ./.github/actions/run-collector-documentation-quality
        with:
          output-json: project_sources/validation/out_validate_on_push_documentation_quality/collector_documentation_quality.json

      - name: Run PSScriptAnalyzer on collector source
        uses: ./.github/actions/run-psscriptanalyzer
        with:
          fail-on-error-severity: 'false'

      - name: Check for duplicate function definitions
        uses: ./.github/actions/run-duplicate-function-check
        with:
          fail-on-duplicates: 'false'

      - name: Validate duplicate-function reports
        shell: pwsh
        run: |
          python .github/github_actions/tools/validate_duplicate_function_reports.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Duplicate-function report validation failed.'
          }

      - name: Run PowerShell review-assist report
        uses: ./.github/actions/run-powershell-review-assist

      - name: Write review-assist report to job summary
        if: always()
        shell: pwsh
        run: |
          ./.github/scripts/Add-PowerShellReviewAssistSummary.ps1

      - name: Enforce static analysis validation gates
        if: always()
        shell: pwsh
        run: |
          ./.github/scripts/Test-DcoirStaticAnalysisValidationGate.ps1

      - name: Upload validation artifacts
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: validate-on-push-results
          path: |
            project_sources/TestResults/**
            project_sources/validation/out_validate_on_push_gemini/**
            project_sources/validation/out_validate_on_push_agent_runtime/**
            project_sources/validation/out_validate_on_push_collector/**
            project_sources/validation/out_validate_on_push_validate_dcoir_run_fixtures/**
            project_sources/validation/out_preflight_documentation_quality/**
            project_sources/validation/out_validate_on_push_documentation_quality/**
            project_sources/collector/powershell_analyzer_report.json
            project_sources/collector/powershell_duplicate_function_report.json
            project_sources/collector/powershell_duplicate_function_report.md
            project_sources/collector/powershell_review_assist_workflow_report.json
            project_sources/collector/powershell_review_assist_workflow_report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Write ChatGPT workflow report section
        if: always()
        shell: pwsh
        env:
          AGENT_RUNTIME_REVIEWED_HEAD_SHA: ${{ github.sha }}
          AGENT_RUNTIME_TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          $agentRuntimeReceiptPath = 'project_sources/validation/out_validate_on_push_agent_runtime/agent_runtime_validation.json'
          if (Test-Path -LiteralPath $agentRuntimeReceiptPath -PathType Leaf) {
            $agentRuntimeValidation = 'passed_receipt_produced'
            $agentRuntimeArtifact = 'agent_runtime_validation.json is included in validate-on-push-results.'
          }
          else {
            $agentRuntimeValidation = 'incomplete_or_failed_receipt_not_produced'
            $agentRuntimeArtifact = 'agent_runtime_validation.json is absent because the eight-command contract did not complete successfully.'
          }
          New-Item -ItemType Directory -Force -Path chatgpt_workflow_report_section | Out-Null
          @"
          ## Push validation summary

          - workflow: validate-on-push
          - workflow_run_id: $env:GITHUB_RUN_ID
          - workflow_run_attempt: $env:GITHUB_RUN_ATTEMPT
          - head_sha: $env:AGENT_RUNTIME_REVIEWED_HEAD_SHA
          - tested_commit_sha: $env:AGENT_RUNTIME_TESTED_COMMIT_SHA
          - ref: $env:GITHUB_REF
          - event_name: $env:GITHUB_EVENT_NAME
          - primary_artifact: validate-on-push-results
          - artifact_note: includes the agent-runtime validation receipt only when all eight commands pass; also includes Gemini smoke-build output, collector package smoke-build output, validate_DCOIR_Run fixture output, documentation-quality output, PSScriptAnalyzer JSON, duplicate-function JSON/Markdown, PowerShell review-assist JSON/Markdown, and TestResults when produced.
          - agent_runtime_validation: $agentRuntimeValidation
          - agent_runtime_artifact: $agentRuntimeArtifact
          - job_summary: review-assist report written to GITHUB_STEP_SUMMARY.
          - duplicate_function_check: emits JSON/Markdown artifacts before the static analysis validation gate blocks merge on any cross-file function name collision in collector source.
          - psscriptanalyzer_gate: emits JSON before the static analysis validation gate blocks merge on any Error-severity finding; Warnings reported but non-blocking.
          - static_analysis_gate: runs after static reports are generated so review tooling can consume the evidence artifact even when the gate fails.

          The workflow conclusion is the authoritative pass/fail signal for the push validation lane. Use artifact readback for harness, package, documentation, or report-specific claims.
          "@ | Set-Content -Path chatgpt_workflow_report_section/chatgpt_workflow_report_section.md -Encoding utf8

      - name: Upload ChatGPT workflow report section
        if: always()
        uses: ./.github/actions/upload-chatgpt-artifact
        with:
          name: chatgpt-workflow-report-section
          path: chatgpt_workflow_report_section/chatgpt_workflow_report_section.md
          if-no-files-found: error
          retention-days: 14
