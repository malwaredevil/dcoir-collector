name: Run path-safety self-tests
description: Run the path-safety and delivery-zip identity self-tests; this action owns the self-test list.
runs:
  using: composite
  steps:
    - name: Run path-safety self-tests
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $selftests = @(
          'project_sources/agent_runtime/tests/agent_runtime_path_safety_selftest.py'
          'project_sources/gemini/tools/lib/gemini_bundle_path_safety_selftest.py'
          'project_sources/gemini/tools/gemini_bundle_path_safety_integration_selftest.py'
          'project_sources/gemini/tools/lib/gemini_production_like_harness_construct_selftest.py'
          'project_sources/gemini/tools/reassemble_dcoir_gemini_prime_agent_selftest.py'
          'project_sources/gemini/tools/lib/gemini_bundle_zip_contract_selftest.py'
          'project_sources/gemini/tools/lib/gemini_bundle_validation_selftest.py'
          '.github/github_actions/tools/test_surface_delivery_zip.py'
        )
        $missing = @($selftests | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
        if ($missing.Count -gt 0) {
          throw "Missing path-safety self-test(s): $($missing -join ', ')"
        }
        foreach ($selftest in $selftests) {
          Write-Output "Running path-safety self-test: $selftest"
          python $selftest
          if ($LASTEXITCODE -ne 0) {
            throw "Path-safety self-test failed: $selftest"
          }
        }

# Compensating evidence: caller-visible step name, stdout markers, explicit inputs,
# and generated output paths/artifacts preserve review evidence despite composite
# action grouping.
